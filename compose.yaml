services:
  backend:
    build: ./backend
    # オフラインでも起動できるよう、python イメージをレジストリに取りに行かない
    pull_policy: never
    ports:
      - "8000:8000"
      - "8081:8081"
    environment:
      # COLLISION=1 docker compose up -d で衝突判定（近似球・障害物・距離 API）を有効にする
      COLLISION: ${COLLISION:-1}
    # COPY したコードをホスト側で上書きし、コード変更のたびにビルドしなくて済むようにする
    volumes:
      - ./backend:/app/backend
    # 保存したコードを自動で再読み込みする
    command: ["uvicorn", "backend.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    restart: unless-stopped

  frontend:
    build: ./frontend
    pull_policy: never
    ports:
      - "8080:8080"
    environment:
      BACKEND_URL: http://backend:8000
    # コード変更は docker compose restart frontend で反映する
    volumes:
      - ./frontend:/app/frontend
    depends_on:
      - backend
    restart: unless-stopped

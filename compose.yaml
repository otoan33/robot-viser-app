services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
      - "8081:8081"
    environment:
      # COLLISION=1 docker compose up -d で衝突判定（近似球・障害物・距離 API）を有効にする
      COLLISION: ${COLLISION:-0}
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "8080:8080"
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped
